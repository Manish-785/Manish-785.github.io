<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">NEB benchmark: ML-Hessian preconditioned L-BFGS versus FIRE</title>
  <desc id="d">Left: systems converged. All 60 systems: 33 versus 28 for FIRE. Sealed held-out set of 31: 22 versus 14. Surface reactions, 26: 11 versus 7. Right: median band evaluations relative to FIRE where both converged: 0.18, 95% CI 0.14 to 0.23, n = 24.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; fill: #3d3f44; }
    .h { font-size: 15px; font-weight: 600; fill: #1d1e21; }
    .s { font-size: 12.5px; }
    .n { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .f { font-size: 11px; fill: #6b6e75; }
    .ours { fill: #1a5e8a; }
    .fire { fill: #b9bcc2; }
    .track { fill: #eceae4; }
    .axis { stroke: #c9c6bf; stroke-width: 1; }
    .ci { stroke: #1d1e21; stroke-width: 1.5; }
    .in { fill: #1d1e21; }
    @media (prefers-color-scheme: dark) {
      text { fill: #c9c7c1; }
      .h { fill: #ecebe6; }
      .f { fill: #8f9196; }
      .ours { fill: #7fb6dc; }
      .fire { fill: #5c6067; }
      .track { fill: #26282c; }
      .axis { stroke: #3a3d42; }
      .ci { stroke: #ecebe6; }
      .in { fill: #ecebe6; }
    }
  </style>

  <!-- Legend -->
  <rect class="ours" x="20" y="14" width="12" height="12" rx="2"/>
  <text class="s" x="38" y="24">ML-Hessian preconditioned L-BFGS (this work)</text>
  <rect class="fire" x="340" y="14" width="12" height="12" rx="2"/>
  <text class="s" x="358" y="24">FIRE (standard NEB optimiser)</text>

  <!-- Left panel: systems converged (bar length = fraction of the set) -->
  <text class="h" x="20" y="64">Systems converged</text>
  <!-- set 1: all 60 -->
  <text class="s" x="20" y="92">All systems (60)</text>
  <rect class="track" x="20" y="100" width="300" height="12" rx="2"/>
  <rect class="ours"  x="20" y="100" width="165" height="12" rx="2"/>  <!-- 33/60 -->
  <text class="n" x="328" y="110">33</text>
  <rect class="track" x="20" y="116" width="300" height="12" rx="2"/>
  <rect class="fire"  x="20" y="116" width="140" height="12" rx="2"/>  <!-- 28/60 -->
  <text class="n" x="328" y="126">28</text>
  <!-- set 2: held-out 31 -->
  <text class="s" x="20" y="158">Sealed held-out set (31)</text>
  <rect class="track" x="20" y="166" width="300" height="12" rx="2"/>
  <rect class="ours"  x="20" y="166" width="212.9" height="12" rx="2"/> <!-- 22/31 -->
  <text class="n" x="328" y="176">22</text>
  <rect class="track" x="20" y="182" width="300" height="12" rx="2"/>
  <rect class="fire"  x="20" y="182" width="135.5" height="12" rx="2"/> <!-- 14/31 -->
  <text class="n" x="328" y="192">14</text>
  <!-- set 3: surface reactions 26 -->
  <text class="s" x="20" y="224">Surface reactions, OC20NEB (26)</text>
  <rect class="track" x="20" y="232" width="300" height="12" rx="2"/>
  <rect class="ours"  x="20" y="232" width="126.9" height="12" rx="2"/> <!-- 11/26 -->
  <text class="n" x="328" y="242">11</text>
  <rect class="track" x="20" y="248" width="300" height="12" rx="2"/>
  <rect class="fire"  x="20" y="248" width="80.8" height="12" rx="2"/>  <!-- 7/26 -->
  <text class="n" x="328" y="258">7</text>

  <!-- Right panel: band evaluations relative to FIRE -->
  <text class="h" x="400" y="64">Band evaluations relative to FIRE</text>
  <text class="s" x="400" y="84">median over the 24 systems both methods converged</text>
  <line class="axis" x1="400" y1="104" x2="400" y2="232"/>
  <!-- scale: 1.0 = 280 px -->
  <text class="s" x="400" y="122">FIRE</text>
  <rect class="fire" x="400" y="130" width="280" height="22" rx="2"/>
  <text class="n in" x="672" y="146" text-anchor="end">1.0</text>
  <text class="s" x="400" y="184">This work</text>
  <rect class="ours" x="400" y="192" width="50.4" height="22" rx="2"/>   <!-- 0.18 -->
  <line class="ci" x1="439.2" y1="203" x2="464.4" y2="203"/>           <!-- CI 0.14-0.23 -->
  <line class="ci" x1="439.2" y1="197" x2="439.2" y2="209"/>
  <line class="ci" x1="464.4" y1="197" x2="464.4" y2="209"/>
  <text class="n" x="474" y="208">0.18×  (95% CI 0.14–0.23)</text>

</svg>
