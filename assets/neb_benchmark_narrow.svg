<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">NEB benchmark: ML-Hessian preconditioned L-BFGS versus FIRE</title>
  <desc id="d">Systems converged: all 60, 33 versus 28; held-out 31, 22 versus 14; surface reactions 26, 11 versus 7. Median band evaluations relative to FIRE: 0.18, 95% CI 0.14 to 0.23, n = 24.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; fill: #3d3f44; }
    .h { font-size: 15px; font-weight: 600; fill: #1d1e21; }
    .s { font-size: 12.5px; }
    .n { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .f { font-size: 11px; fill: #6b6e75; }
    .ours { fill: #1a5e8a; }
    .fire { fill: #b9bcc2; }
    .track { fill: #eceae4; }
    .axis { stroke: #c9c6bf; stroke-width: 1; }
    .ci { stroke: #1d1e21; stroke-width: 1.5; }
    .in { fill: #1d1e21; }
    @media (prefers-color-scheme: dark) {
      text { fill: #c9c7c1; }
      .h { fill: #ecebe6; }
      .f { fill: #8f9196; }
      .ours { fill: #7fb6dc; }
      .fire { fill: #5c6067; }
      .track { fill: #26282c; }
      .axis { stroke: #3a3d42; }
      .ci { stroke: #ecebe6; }
      .in { fill: #ecebe6; }
    }
  </style>
  <rect class="ours" x="16" y="12" width="12" height="12" rx="2"/><text class="s" x="34" y="22">ML-Hessian L-BFGS (this work)</text>
  <rect class="fire" x="16" y="32" width="12" height="12" rx="2"/><text class="s" x="34" y="42">FIRE (standard NEB optimiser)</text>
  <text class="h" x="16" y="80">Systems converged</text>
  <text class="s" x="16" y="104">All systems (60)</text>
  <rect class="track" x="16" y="112" width="250" height="12" rx="2"/><rect class="ours" x="16" y="112" width="137.5" height="12" rx="2"/><text class="n" x="274" y="122">33</text>
  <rect class="track" x="16" y="128" width="250" height="12" rx="2"/><rect class="fire" x="16" y="128" width="116.7" height="12" rx="2"/><text class="n" x="274" y="138">28</text>
  <text class="s" x="16" y="166">Sealed held-out set (31)</text>
  <rect class="track" x="16" y="174" width="250" height="12" rx="2"/><rect class="ours" x="16" y="174" width="177.4" height="12" rx="2"/><text class="n" x="274" y="184">22</text>
  <rect class="track" x="16" y="190" width="250" height="12" rx="2"/><rect class="fire" x="16" y="190" width="112.9" height="12" rx="2"/><text class="n" x="274" y="200">14</text>
  <text class="s" x="16" y="228">Surface reactions, OC20NEB (26)</text>
  <rect class="track" x="16" y="236" width="250" height="12" rx="2"/><rect class="ours" x="16" y="236" width="105.8" height="12" rx="2"/><text class="n" x="274" y="246">11</text>
  <rect class="track" x="16" y="252" width="250" height="12" rx="2"/><rect class="fire" x="16" y="252" width="67.3" height="12" rx="2"/><text class="n" x="274" y="262">7</text>

  <text class="h" x="16" y="316">Band evaluations relative to FIRE</text>
  <text class="s" x="16" y="334">median, 24 systems both converged</text>
  <text class="s" x="16" y="362">FIRE</text>
  <rect class="fire" x="16" y="370" width="250" height="20" rx="2"/><text class="n in" x="258" y="385" text-anchor="end">1.0</text>
  <text class="s" x="16" y="418">This work</text>
