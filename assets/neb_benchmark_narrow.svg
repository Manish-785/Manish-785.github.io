  <line class="ci" x1="51.0" y1="436" x2="73.5" y2="436"/><line class="ci" x1="51.0" y1="430" x2="51.0" y2="442"/><line class="ci" x1="73.5" y1="430" x2="73.5" y2="442"/>
  <text class="n" x="83.5" y="441">0.18×  (CI 0.14–0.23)</text>
